# Render blueprint: one web service + one Postgres, both in Frankfurt.
#
# IMPORTANT: the app must connect to Postgres directly on 5432. Never enable
# Render's connection pooler (PgBouncer transaction mode) on this database —
# ActionCable's postgresql adapter needs LISTEN, which requires a
# session-pinned connection. `connectionString` below is the direct URL.
databases:
  - name: arete-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "18"

services:
  - type: web
    name: arete
    # Docker, not the native Ruby runtime: the Dockerfile ships a current
    # libvips (variants), poppler (M3 deck ingest), and jemalloc via
    # LD_PRELOAD — none of which the native runtime provides.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    preDeployCommand: bin/rails db:migrate
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false # set in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arete-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # 2+ workers on purpose: a per-process cable adapter bug (async/memory
      # store) must surface, not hide behind a single worker.
      - key: WEB_CONCURRENCY
        value: "2"
      # Thruster (the Dockerfile CMD) listens on HTTP_PORT and starts Puma on
      # an internal target port. Render routes public traffic to PORT, which
      # defaults to 10000 — point Thruster there.
      - key: HTTP_PORT
        value: "10000"
      # Cap vips' thread pool: variant transforms run in-process on a
      # memory-constrained instance.
      - key: VIPS_CONCURRENCY
        value: "1"
