default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

# Production runs without a dispatcher to save a full Rails process (~100MB
# on a 512MB instance). The dispatcher's only job is moving *delayed* jobs
# (`wait:` / `wait_until:`) into ready — nothing enqueues those today, and
# recurring.yml tasks are fired by the scheduler, not the dispatcher.
# If a delayed job is ever added, restore `dispatchers:` here or it will sit
# in `scheduled` forever.
production:
  workers:
    - queues: "*"
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2
